minimumReleaseAge: 1440
packages:
  - "src/*"
  - "documentation"
  - "scripts"

# `overrides` et les scripts de build autorisés vivent ici, plus dans package.json :
# pnpm ne les lit plus depuis le manifeste. Les y laisser fait échouer
# `pnpm install --frozen-lockfile` — pnpm calcule alors zéro override, ce qui ne
# correspond plus à ceux enregistrés dans le lockfile.
overrides:
  "react": "18.3.1"
  "react-dom": "18.3.1"
  "@types/react": "18.2.79"
  "@types/react-dom": "18.2.25"
  "loader-utils": "2.0.4"
  "shell-quote": "1.8.1"
  # CVE-2026-102276 et CVE-2026-102278 (DoS par motifs d'accolades), corrigées en 2.1.6 / 5.0.11.
  # À supprimer dès que minimatch tirera ces versions.
  "brace-expansion@2": "^2.1.6"
  "brace-expansion@5": "^5.0.11"

# Scripts d'installation autorisés. pnpm 12 ne lit plus `onlyBuiltDependencies` :
# toute dépendance à script de build absente d'ici fait échouer `pnpm install` en
# CI (ERR_PNPM_IGNORED_BUILDS).
allowBuilds:
  "@parcel/watcher": true
  core-js: true
  esbuild: true
  sharp: true
  "@oxlint/darwin-universal": true
