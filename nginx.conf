server {
    listen 8080 default_server;
    server_name /usr/share/nginx/html;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_comp_level 9;

    etag on;

    # En-têtes de sécurité, sur toutes les réponses (`always` : y compris 404 et 5xx).
    # `frame-ancestors` est ignoré dans la balise <meta> CSP de index.html : seul un en-tête
    # HTTP le fait appliquer. 'self' et non 'none' : oidc-spa recharge l'application dans
    # une iframe de même origine pour le renouvellement silencieux de session.
    # Cet en-tête s'ajoute à la CSP du <meta> (le navigateur applique les deux).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    # Sans cette directive, un `add_header` posé dans une location efface ceux du server.
    add_header_inherit merge;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers produits par Vite, nommés d'après le hash de leur contenu : un nom ne désigne
    # jamais deux contenus, on les garde en cache indéfiniment.
    # Pas de repli sur index.html : un chunk absent (ancien déploiement) doit répondre 404,
    # pas du HTML servi comme module JS.
    # Pas de `always` sur Cache-Control : ce 404 ne doit pas rester un an dans un cache
    # intermédiaire (déploiement progressif où le chunk arrive après l'index).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        etag off; # optional to avoid generating an ETag
    }
}
