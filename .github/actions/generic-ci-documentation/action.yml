name: "Build Documentation"
description: Builds the Astro documentation and Storybook into ./website, ready to be deployed
runs:
  using: "composite"
  steps:
    # Node et pnpm : les versions partagées, déclarées une seule fois dans le
    # commons. Cette action lisait auparavant le `packageManager` du manifeste,
    # qui n'existe plus — sans version ni de l'un ni de l'autre côté,
    # pnpm/action-setup refuse de démarrer.
    - uses: InseeFr/rmes-githubactions-commons/.github/actions/setup-front@main
    - name: 🏗️ Generate Astro Documentation
      shell: bash
      run: ./scripts/documentation-build.sh
    - name: 🏗️ Installing Application Dependencies
      shell: bash
      run: pnpm install
    - name: 🏗️ Build Storybook
      shell: bash
      run: pnpm build-storybook
    - name: 📁 Generate WebSite folder before deploying
      shell: bash
      run: ./scripts/documentation-deploy.sh
