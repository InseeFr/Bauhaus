name: Release

# Publishes the image of a prerelease on ghcr.io, once the application has
# passed its checks. The build itself lives in
# InseeFr/rmes-githubactions-commons, shared with the other RMéS projects.

on:
  release:
    types: [prereleased]

jobs:
  # Quality gate: nothing is handed over to the docker job, which rebuilds the
  # application from source inside the Dockerfile.
  build:
    name: Build & check the application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: InseeFr/rmes-githubactions-commons/.github/actions/quality-front@main
        with:
          # 8.68% of duplicated lines today, above the commons' 2%: the threshold
          # is raised here rather than dropping the check.
          jscpd-threshold: '10'

  docker:
    needs: build
    uses: InseeFr/rmes-githubactions-commons/.github/workflows/docker-publish.yml@main
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      image: inseefr/bauhaus
      registry: ghcr.io
