name: Quality

# Vérifie le front sur chaque PR et publie le rapport Sonar. Les vérifications
# elles-mêmes vivent dans InseeFr/rmes-githubactions-commons, partagées avec les
# autres fronts RMéS ; seul le scan Sonar reste ici, il est propre au dépôt.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  schedule:
    # Tous les lundis à 6h UTC
    - cron: '0 12 * * 1'
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true
jobs:
  test-build:
    name: Test & Build & Deploy Sonar report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: InseeFr/rmes-githubactions-commons/.github/actions/quality-front@main
      - name: SonarCloud Scan
        # Les PR Dependabot n'ont pas accès aux secrets du dépôt : le scan
        # échouerait sur un SONAR_TOKEN vide.
        if: github.actor != 'dependabot[bot]'
        # sonarcloud-github-action est dépréciée au profit de celle-ci, qui vise
        # SonarQube Cloud via `sonar.host.url` (sonar-project.properties).
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
