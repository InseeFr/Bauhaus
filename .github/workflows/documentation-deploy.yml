name: Build and Deploy Documentation On Main
on:
  push:
    branches:
      - "main"
    paths:
      - .github/
      - documentation/**
      # Storybook est publié avec la documentation : redéployer quand il change
      - .storybook/**
      - src/**
jobs:
  deploy:
    name: Deploy to GH Pages
    runs-on: ubuntu-latest
    # Écriture nécessaire : actions-gh-pages pousse le site sur la branche
    # gh-pages avec ce token. Rien d'autre n'est accordé.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Use Generic CI For Documentation
        uses: ./.github/actions/generic-ci-documentation
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website
