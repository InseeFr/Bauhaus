name: Playwright Tests
on:
  pull_request:
    branches: [main, master]
jobs:
  playwright:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout BackOffice
        uses: actions/checkout@v4
        with:
          repository: InseeFr/Bauhaus-Back-Office
          # Épinglé sur la branche de release du back, pas sur `main` : `main` (= tag
          # 4.21.1) tire encore `minio/minio`, refusé au pull par Docker Hub ; l'image
          # pgsty/minio n'existe qu'à partir de 4.21.2. Repasser sur la branche par
          # défaut (supprimer ce `ref`) une fois 4.21.2 fusionnée dans `main`.
          ref: 4.21.2
          path: ./bauhaus-back-office
      # Versions de Node et pnpm partagées par tous les fronts RMéS.
      - uses: InseeFr/rmes-githubactions-commons/.github/actions/setup-front@main

      # Le serveur de dev de l'IHM est démarré par Playwright (webServer) :
      # ses dépendances doivent donc être installées à la racine du dépôt.
      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Install e2e dependencies
        working-directory: ./e2e
        run: npm ci
      - name: Install Playwright browsers
        working-directory: ./e2e
        run: npx playwright install --with-deps chromium

      # Le back démarre séparément, APRÈS le chargement des fixtures : depuis 4.21.1 il
      # vérifie au démarrage que `defaultContributor` existe en base de gestion, et il
      # échoue définitivement (aucun `restart:`) si les dépôts RDF n'existent pas encore.
      - name: Start GraphDB
        run: |
          docker compose -f ./bauhaus-back-office/module-bauhaus-bo/compose.yaml up -d graphdb minio
          timeout 300 bash -c 'until curl -sf http://localhost:7200/rest/repositories > /dev/null; do sleep 5; done'

      - name: Load test data
        working-directory: ./e2e
        env:
          BACK_OFFICE_HOME: ../bauhaus-back-office
        run: ./playwright/db/init.sh

      - name: Start the Back-Office
        run: |
          docker compose -f ./bauhaus-back-office/module-bauhaus-bo/compose.yaml \
            -f ./e2e/compose.ci.yaml up -d bauhaus-back
          timeout 300 bash -c 'until curl -sf http://localhost:8080/api/init > /dev/null; do sleep 5; done'

      # La suite dure ~2 min : au-delà de 10, elle est bloquée. Un timeout d'étape
      # fait échouer le job (au lieu de l'annuler au bout des 45 min du job), et
      # l'upload du rapport ci-dessous tourne quand même.
      - name: Run Playwright tests
        timeout-minutes: 10
        working-directory: ./e2e
        env:
          CI: "true"
          VITE_API_BASE_HOST: http://localhost:8080/api
          # Trace le lancement de Chromium : un blocage à cette étape n'est borné
          # par aucun timeout Playwright et ne laisse sinon aucune trace.
          DEBUG: pw:browser
        # `list` affiche chaque test à son démarrage : le reporter `github` seul
        # n'écrit rien avant la fin, un blocage restait donc muet.
        run: npx playwright test --reporter=list,github,html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30
