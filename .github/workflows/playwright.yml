name: Playwright Tests

# Tests de bout en bout contre un Back-Office et une base RDF réels, sur les deux
# bases que le Back-Office sait servir : GraphDB (celle de la prod) et Fuseki
# (fr.insee.rmes.rdf.backend=fuseki). Une ligne de matrice par base, sans
# fail-fast : un écart propre à l'une ne doit pas masquer le résultat de l'autre.
#
# La pile vit ici, propre à Bauhaus, et se monte par scripts/e2e-stack.sh, le
# même script qu'en local (RDF_BACKEND choisit la base) : base RDF et minio,
# fixtures, puis le back — dont les vérifications de démarrage échouent pour de
# bon tant que les dépôts RDF n'existent pas. Playwright lui-même (install,
# navigateurs, rapport) est l'action partagée de InseeFr/rmes-githubactions-commons.
#
# Déclencheurs : chaque pull request, un lancement manuel, et une passe
# nocturne sur la branche par défaut, qui attrape ce qui casse sans pull
# request (Back-Office modifié seul, image de base RDF, dépendances). Chaque
# ligne publie son rapport HTML en artefact (playwright-report-<base>).
#
# Branche du Back-Office : par défaut celle qui porte le même nom que la branche
# du front, sinon la branche par défaut du Back-Office. Un lancement manuel peut
# en imposer une autre, et viser un autre dépôt (un fork) ; une branche imposée
# est prise telle quelle, sans repli : une faute de frappe doit échouer.

on:
  pull_request:
    branches: [main, master]
  schedule:
    # Toutes les nuits, 3 h UTC. GitHub suspend les cron d'un dépôt resté
    # 60 jours sans activité.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      back-office-repository:
        description: "Dépôt du Back-Office (owner/nom), par exemple un fork"
        required: false
        default: InseeFr/Bauhaus-Back-Office
      back-office-ref:
        description: "Branche, tag ou SHA du Back-Office. Vide = même nom que la branche du front, sinon la branche par défaut"
        required: false
        default: ""

jobs:
  playwright:
    name: playwright (${{ matrix.rdf-backend }})
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rdf-backend: graphdb
            compose-file: docker-compose.yml
          - rdf-backend: fuseki
            compose-file: compose-fuseki.yaml
    # Lecture seule : le job clone ce dépôt et le Back-Office, tous deux publics.
    permissions:
      contents: read
    env:
      BACK_OFFICE_PATH: bauhaus-back-office
      # Lu par les fichiers compose (contexte de build, configuration montée) et
      # par init.sh (fixtures RDF). Absolu : chacun le lirait sinon depuis son
      # propre répertoire.
      BACK_OFFICE_HOME: ${{ github.workspace }}/bauhaus-back-office
      # Lu par scripts/e2e-stack.sh, puis par init.sh qu'il lance.
      RDF_BACKEND: ${{ matrix.rdf-backend }}
      # Les fichiers compose qu'e2e-stack.sh choisit pour cette base, repris
      # ici pour lire les journaux en cas d'échec.
      COMPOSE_FILES: -f ${{ matrix.compose-file }} -f e2e/compose.e2e.yaml
    steps:
      - uses: actions/checkout@v7

      - name: Résolution du dépôt et de la branche du Back-Office
        id: ref
        env:
          INPUT_REF: ${{ inputs.back-office-ref }}
          # Hors workflow_dispatch, l'input est vide : vide veut dire le dépôt par défaut.
          REPOSITORY: ${{ inputs.back-office-repository || 'InseeFr/Bauhaus-Back-Office' }}
          # Sur une pull request, github.ref_name vaut `<numéro>/merge` : la branche
          # nommée par le développeur est head_ref.
          FRONT_BRANCH: ${{ github.head_ref || github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code "$SERVER_URL/$REPOSITORY.git" HEAD >/dev/null 2>&1; then
            echo "::error::impossible de joindre $REPOSITORY : vérifier back-office-repository (owner/nom, dépôt public)"
            exit 1
          fi
          echo "repository=$REPOSITORY" >> "$GITHUB_OUTPUT"
          if [ -n "$INPUT_REF" ]; then
            ref="$INPUT_REF"
            origin="imposée"
          elif git ls-remote --exit-code --heads "$SERVER_URL/$REPOSITORY.git" "refs/heads/$FRONT_BRANCH" >/dev/null; then
            ref="$FRONT_BRANCH"
            origin="même nom que la branche du front"
          else
            ref=$(git ls-remote --symref "$SERVER_URL/$REPOSITORY.git" HEAD | sed -n 's|^ref: refs/heads/\(.*\)\tHEAD$|\1|p')
            if [ -z "$ref" ]; then
              echo "::error::impossible de lire la branche par défaut de $REPOSITORY"
              exit 1
            fi
            origin="branche par défaut, $REPOSITORY n'a pas de branche $FRONT_BRANCH"
            echo "::notice::pas de branche $FRONT_BRANCH sur $REPOSITORY : tests contre sa branche par défaut, $ref"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Back-Office : \`$REPOSITORY@$ref\` ($origin), base RDF : $RDF_BACKEND" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout du Back-Office
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.ref.outputs.repository }}
          ref: ${{ steps.ref.outputs.ref }}
          path: ${{ env.BACK_OFFICE_PATH }}

      - name: Démarrage de la pile (base RDF, minio, fixtures, Back-Office)
        run: ./scripts/e2e-stack.sh

      - name: Journaux de la pile
        if: failure()
        run: docker compose $COMPOSE_FILES logs --no-color

      - uses: InseeFr/rmes-githubactions-commons/.github/actions/playwright@main
        with:
          working-directory: e2e
          e2e-install-command: npm ci
          browsers: chromium
          # Un artefact par ligne de matrice : deux envois du même nom échouent.
          report-name: playwright-report-${{ matrix.rdf-backend }}
