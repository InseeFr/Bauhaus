name: Playwright Tests

# Tests de bout en bout contre un Back-Office et un GraphDB réels. La séquence
# (checkout du Back-Office, GraphDB, fixtures, back, Playwright) vit dans
# InseeFr/rmes-githubactions-commons, partagée avec les autres fronts RMéS.
#
# Branche du Back-Office : par défaut celle qui porte le même nom que la branche
# du front, sinon la branche par défaut du Back-Office. Un lancement manuel peut
# en imposer une autre, et viser un autre dépôt (un fork).

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      back-office-repository:
        description: "Dépôt du Back-Office (owner/nom), par exemple un fork"
        required: false
        default: InseeFr/Bauhaus-Back-Office
      back-office-ref:
        description: "Branche, tag ou SHA du Back-Office. Vide = même nom que la branche du front, sinon la branche par défaut"
        required: false
        default: ''

jobs:
  playwright:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: InseeFr/rmes-githubactions-commons/.github/actions/playwright@main
        with:
          back-office-repository: ${{ inputs.back-office-repository }}
          back-office-ref: ${{ inputs.back-office-ref }}
