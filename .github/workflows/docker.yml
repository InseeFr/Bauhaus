name: Release

# Publishes the image of a final release on Docker Hub, once the application has
# passed its checks. The build itself lives in
# InseeFr/rmes-githubactions-commons, shared with the other RMéS projects.

on:
  release:
    types: [released]

jobs:
  # Quality gate: nothing is handed over to the docker job, which rebuilds the
  # application from source inside the Dockerfile.
  build:
    name: Test & Build the application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Use Generic CI For Building the Application
        uses: ./.github/actions/generic-ci-app

  docker:
    needs: build
    uses: InseeFr/rmes-githubactions-commons/.github/workflows/docker-publish.yml@main
    permissions:
      contents: read
    secrets: inherit
    with:
      image: inseefr/bauhaus
