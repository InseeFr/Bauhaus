name: Release

# Publishes the image of a final release on Docker Hub, once the application has
# passed its checks. The build itself lives in
# InseeFr/rmes-githubactions-commons, shared with the other RMéS projects.

on:
  release:
    types: [released]

jobs:
  # Quality gate first, publication second, in the same job: the image is only
  # pushed once the checks pass. Nothing is handed over between the two steps,
  # the Dockerfile rebuilds the application from source.
  release:
    name: Test & Build the application
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: InseeFr/rmes-githubactions-commons/.github/actions/quality-front@main
        with:
          # 8.68% of duplicated lines today, above the commons' 2%: the threshold
          # is raised here rather than dropping the check.
          jscpd-threshold: '10'
      - uses: InseeFr/rmes-githubactions-commons/.github/actions/docker-publish@main
        with:
          image: inseefr/bauhaus
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
